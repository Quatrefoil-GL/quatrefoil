name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: upload-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Set up Calcit and Caps
        uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru

      - name: Resolve immutable dependencies
        run: |
          set -euo pipefail
          caps --ci --strict
          yarn install --immutable
          caps verify --toolchain

      - name: Validate Calcit snapshot and types
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit calcit.cirru --check-only --all-defs --format json | jq '{summary:.data.summary,failures:[.data.definitions[]? | select(.status != "passed")],diagnostics:.diagnostics}'
          calcit calcit.cirru --check-only \
            --ns quatrefoil.alias \
            --ns quatrefoil.app.comp.container \
            --ns quatrefoil.app.comp.control \
            --ns quatrefoil.app.comp.lines \
            --ns quatrefoil.app.comp.mirror \
            --ns quatrefoil.app.comp.portal \
            --ns quatrefoil.app.comp.quat-tree \
            --ns quatrefoil.app.comp.shader \
            --ns quatrefoil.app.comp.shapes \
            --ns quatrefoil.app.comp.todolist \
            --ns quatrefoil.app.comp.triflorum \
            --ns quatrefoil.app.main \
            --ns quatrefoil.app.materials \
            --ns quatrefoil.app.updater \
            --ns quatrefoil.comp.control \
            --ns quatrefoil.core \
            --ns quatrefoil.cursor \
            --ns quatrefoil.dsl.diff \
            --ns quatrefoil.dsl.object3d-dom \
            --ns quatrefoil.dsl.patch \
            --ns quatrefoil.globals \
            --ns quatrefoil.math \
            --ns quatrefoil.schema \
            --ns quatrefoil.util.core \
            --summary-only --format json | jq '{summary:.data.summary,diagnostics:.diagnostics}'
          calcit calcit.cirru analyze weak-types --only coverage --summary-only --format json | jq '.data.summary'
          calcit calcit.cirru analyze weak-types \
            --only schema-dynamic,code-dynamic \
            --intent unresolved \
            --summary-only --format json | jq '.data.summary'
          calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json | jq '.data.summary'
          calcit calcit.cirru analyze weak-types --only dynamic-method

      - name: Validate existing Option contracts
        run: |
          calcit eval --dep ./ -- 'do
            assert= ({}) $ quatrefoil.alias/arrange-children $ []
            assert= nil $ quatrefoil.alias/arrange-children $ [] nil
            assert= false $ quatrefoil.alias/arrange-children $ [] false
            assert= 0 $ quatrefoil.alias/arrange-children $ [] 0
            assert= | $ quatrefoil.alias/arrange-children $ [] |
            assert= ({} (:states $ {} (:probe $ {} (:data nil))))
              quatrefoil.cursor/update-states ({} (:states $ {})) ([] ([] :probe) nil)
            println |option-contracts-passed'

      - name: Verify tree-utils lockfile
        working-directory: tree-utils
        run: yarn install --immutable

      - name: Select CDN asset path
        id: asset-path
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
          fi
          base_url="${CDN_ORIGIN}/${asset_prefix}"
          echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

      - name: Build web assets with CDN URLs
        run: |
          set -euo pipefail
          yarn compile
          cp assets/* js-out/
          yarn build

      - name: Upload and verify static assets on COS
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@v1.2.0
        timeout-minutes: 10
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.asset-path.outputs.prefix }}
          public-base-url: ${{ steps.asset-path.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
