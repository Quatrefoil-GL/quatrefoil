name: Upload

on:
  push:
    branches:
      - master
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable && corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1

      - name: Verify dependencies and strict types
        run: |
          caps --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit --check-only
          calcit analyze dynamic-methods --max 0

      - name: Verify tree-utils lockfile
        working-directory: tree-utils
        run: yarn install --immutable

      - name: Build
        run: |
          calcit js
          cp assets/* js-out/
          yarn vite build --base=./

      - name: Deploy to server
        if: github.event_name == 'push'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push'
        run: echo "${{ steps.deploy.outputs.status }}"
